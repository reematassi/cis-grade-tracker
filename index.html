<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root{color-scheme:light;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
    html,body{margin:0}
    body{font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    img{max-width:100%}
    [hidden]{display:none!important}
  </style>
<title>CIS Grade Tracker</title>
<style>
/* Layout: sign-in gate, then a two-pane workspace — your sections as cards on the left,
   the band-count assessment entry on the right. Blue institutional theme, light/dark. */
:root{
  --bg:#eef3fa; --surface:#ffffff; --surface-2:#f5f8fd; --fg:#0f1b2d; --muted:#566782;
  --line:#dbe5f1; --line-2:#c5d4e6; --accent:#1d4ed8; --accent-fg:#ffffff; --accent-soft:#e4ecfb;
  --ok:#1f7a4d; --ok-soft:#e4f3ea; --warn:#9a5a12; --warn-soft:#f6ecdd; --bad:#b4232a; --bad-soft:#fae7e7;
  --focus:#2563eb; --shadow:0 1px 2px rgba(15,27,45,.06),0 8px 24px rgba(15,27,45,.08);
  --r:10px; --r-sm:7px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c121d; --surface:#151e2c; --surface-2:#101723; --fg:#e7edf5; --muted:#8ea0b8;
  --line:#223246; --line-2:#2e4058; --accent:#73a3ff; --accent-fg:#0c121d; --accent-soft:#182a44;
  --ok:#5bd398; --ok-soft:#143026; --warn:#e3a862; --warn-soft:#322510; --bad:#f0858a; --bad-soft:#3a1618;
  --focus:#73a3ff; --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c121d; --surface:#151e2c; --surface-2:#101723; --fg:#e7edf5; --muted:#8ea0b8;
  --line:#223246; --line-2:#2e4058; --accent:#73a3ff; --accent-fg:#0c121d; --accent-soft:#182a44;
  --ok:#5bd398; --ok-soft:#143026; --warn:#e3a862; --warn-soft:#322510; --bad:#f0858a; --bad-soft:#3a1618;
  --focus:#73a3ff; --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.5;font-size:14px;display:flex;flex-direction:column;min-height:100%}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:600}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* sign-in gate */
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gate[hidden]{display:none}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  width:min(400px,100%);padding:30px 26px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.gate-logo{height:46px;width:auto;background:#fff;border-radius:8px;padding:6px 10px;border:1px solid var(--line-2)}
.gate-card h2{font-family:var(--serif);font-size:20px;margin-top:4px}
.gate-sub{color:var(--muted);font-size:13.5px;margin:0}
#gateForm{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:6px}
#gateForm .inp{text-align:center}
#gateBtn{width:100%;justify-content:center;padding:11px}
.gate-err{color:var(--bad);background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;margin:0}
.gate-err[hidden]{display:none}
.gate-note{color:var(--muted);font-size:11.5px;margin:0}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo-img{height:36px;width:auto;border-radius:7px;flex:none;display:block;background:#fff;padding:3px 7px;border:1px solid var(--line-2)}
.brand h1{font-family:var(--serif);font-size:17px;letter-spacing:-.01em;line-height:1.1}
.term{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px;margin-left:7px;letter-spacing:.02em}
.bar .spacer{flex:1}
.whoami{font-size:12.5px;font-weight:600;color:var(--fg);display:inline-flex;align-items:center;gap:6px;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whoami::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--fg);border-radius:var(--r-sm);padding:8px 13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-fg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.btn.icon{padding:8px}

/* workspace */
.wrap{flex:1;display:grid;grid-template-columns:minmax(300px,360px) 1fr;min-height:0}
.rail{border-right:1px solid var(--line);background:var(--surface-2);min-width:0;display:flex;flex-direction:column}
.railpad{padding:18px max(16px,env(safe-area-inset-left,0px)) 24px 16px;display:flex;flex-direction:column;gap:12px}
.rail-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rail-head h2{font-family:var(--serif);font-size:16px}
.count{font-size:11.5px;color:var(--muted);font-weight:600}
.field{position:relative}
label.lbl{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.02em}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);border-radius:var(--r-sm);padding:9px 11px;outline:none}
.inp:focus,select.inp:focus,textarea.inp:focus{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
.inp::placeholder{color:var(--muted);opacity:.8}
.combo input{padding-right:34px}
.combo .caret{position:absolute;right:11px;top:70%;transform:translateY(-50%);pointer-events:none;color:var(--muted);width:14px;height:14px}
.pop{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 5px);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow);max-height:280px;overflow:auto;padding:5px}
.pop[hidden]{display:none}
.opt{padding:8px 10px;border-radius:var(--r-sm);cursor:pointer}
.opt:hover,.opt.active{background:var(--accent-soft)}
.opt-empty{padding:12px 10px;color:var(--muted);text-align:center}
mark{background:color-mix(in srgb,var(--focus) 32%,transparent);color:inherit;border-radius:3px;padding:0 1px}

.cards{display:flex;flex-direction:column;gap:8px;overflow:auto}
.scard{text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:11px 13px;display:flex;flex-direction:column;gap:4px}
.scard:hover{border-color:var(--accent)}
.scard.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.scard .r1{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.scard .cc{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:13px}
.scard .crn{font-family:var(--mono);font-weight:600;font-size:12.5px;color:var(--fg)}
.scard .ti{font-size:13px;color:var(--fg)}
.scard .r2{color:var(--muted);font-size:12px;display:flex;gap:8px;flex-wrap:wrap}
.scard .done{margin-left:auto;color:var(--ok);font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.hint{color:var(--muted);font-size:12.5px}

.main{min-width:0;padding:22px max(20px,env(safe-area-inset-right,0px)) 48px max(20px,16px)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:60px 20px;color:var(--muted);height:100%}
.empty .big{width:54px;height:54px;color:var(--line-2)}
.empty h2{font-family:var(--serif);color:var(--fg);font-size:19px;font-weight:600}
.empty p{max-width:40ch}

.formhead{padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:18px}
.crumb{color:var(--muted);font-size:12.5px;margin-bottom:5px}
.crumb .code{font-family:var(--mono);color:var(--accent);font-weight:600}
.formhead h2{font-family:var(--serif);font-size:22px;letter-spacing:-.01em}
.meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px;color:var(--muted);font-size:13px}
.meta b{color:var(--fg);font-weight:600}
.meta .mono{font-family:var(--mono)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;max-width:720px}
.panel-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel-row.one{grid-template-columns:1fr}
.band{border:1px solid var(--line);border-radius:var(--r-sm);padding:13px;background:var(--surface-2);margin-top:14px}
.band .bh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.band .bt{font-weight:600}
.band .cap{font-size:11.5px;color:var(--muted)}
.band .brow{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.band .brow .field{flex:1;min-width:120px}
.pctbox{min-width:118px;border-radius:var(--r-sm);padding:9px 11px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;border:1px solid var(--line-2);background:var(--surface);color:var(--muted)}
.pctbox.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.pctbox.bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.pctbox small{display:block;font-weight:600;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;opacity:.85}

.notice{border-radius:var(--r);padding:12px 14px;font-size:13px;margin-top:16px;line-height:1.5}
.notice.bad{background:var(--bad-soft);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.notice.ok{background:var(--ok-soft);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.confirm{display:flex;align-items:flex-start;gap:10px;margin-top:16px;font-size:13.5px}
.confirm input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}

.formfoot{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.ghost{background:transparent;border:1px solid var(--line-2);color:var(--muted);border-radius:var(--r-sm);padding:9px 14px}
.ghost:hover{border-color:var(--warn);color:var(--warn)}
.savehint{margin-left:auto;align-self:center;color:var(--muted);font-size:12.5px}

.scrim{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:90;display:grid;place-items:center;padding:20px}
.scrim[hidden]{display:none}
.pop-card{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);width:min(420px,100%);padding:24px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.pop-card h3{font-family:var(--serif);font-size:19px}
.pop-card p{color:var(--fg);margin:0;line-height:1.55}
.pop-card .btn{min-width:120px;justify-content:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:80;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;font-size:13px;box-shadow:var(--shadow);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:860px){.wrap{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid var(--line)}.cards{max-height:40vh}.panel-row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const CLOUD_URL = "https://script.google.com/macros/s/AKfycbw_jiO3aSRugSV3gLvEvLX16nfyUBTNIp4DI713W4SUnp7f7YHqXkNlq891SdaODEpN/exec";

const BANDS = [

  {k:"b", label:"B+ / B / B-",   cap:35},
  {k:"f", label:"F",             cap:20}
];
const POSTMOD = ["Yes","No","Not Required"];
const ASSESS_FALLBACK = ["Exam 1","Exam 2","Quiz 1","Quiz 2","Midterm","Assignment","Project","Presentation","Lab Assignment","Final Examination"];

let AUTH=null, COURSES=[], store={}, shown=[], selIdx=-1;

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(t,q){t=String(t==null?"":t);if(!q)return esc(t);const i=t.toLowerCase().indexOf(q.toLowerCase());if(i<0)return esc(t);return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length));}
let toastT;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2200);}
function showPopup(title,msg){$("#popTitle").textContent=title;$("#popMsg").textContent=msg;$("#popScrim").hidden=false;}
function authEmail(){return (AUTH&&AUTH.email)||"";}
function cloudUrl(){return CLOUD_URL||"";}
function recKey(crn,assess){return String(crn)+"||"+String(assess);}
function enrolledOf(row){const n=parseFloat(row.students);return isNaN(n)?0:n;}
function pctOf(count,enr){if(count===""||count==null)return null;const n=parseFloat(count);if(isNaN(n)||!enr)return null;return Math.round((n/enr*1000))/10;}
function formatTs(v){if(!v)return "—";const d=new Date(v);if(isNaN(d.getTime()))return String(v);try{return d.toLocaleString(undefined,{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});}catch(e){return String(v);}}
function blankRec(){return {a:"",b:"",f:"",confirmed:false,justification:"",status:"",timestamp:""};}
function getRec(crn,assess){const k=recKey(crn,assess);if(!store[k])store[k]=blankRec();return store[k];}
function sectionHasData(crn){for(const k in store){if(k.indexOf(String(crn)+"||")===0){const r=store[k];if(r.a!==""||r.b!==""||r.f!==""){return true;}}}return false;}

/* ---------- combobox ---------- */
function makeCombo(input,pop,options,onPick,render){
  let items=options,active=-1,open=false;
  const filtered=all=>{const q=input.value.trim().toLowerCase();return (all||!q)?items.slice(0,400):items.filter(o=>o._search.includes(q)).slice(0,400);};
  function show(all){const list=filtered(all);
    pop.innerHTML=list.length?list.map((o,i)=>`<div class="opt${i===active?' active':''}" data-i="${i}">${render(o,input.value.trim())}</div>`).join(""):'<div class="opt-empty">No matches — type to add your own</div>';
    pop._list=list;pop.hidden=false;open=true;}
  function hide(){pop.hidden=true;open=false;active=-1;}
  input.addEventListener("focus",()=>{active=-1;show(true);try{input.select();}catch(e){}});
  input.addEventListener("click",()=>{active=-1;show(true);});
  input.addEventListener("input",()=>{active=-1;show(false);});
  input.addEventListener("keydown",e=>{if(!open&&e.key==="ArrowDown"){show(true);return;}const list=pop._list||[];
    if(e.key==="ArrowDown"){e.preventDefault();active=Math.min(active+1,list.length-1);show();}
    else if(e.key==="ArrowUp"){e.preventDefault();active=Math.max(active-1,0);show();}
    else if(e.key==="Enter"){if(open&&active>=0&&list[active]){e.preventDefault();pick(list[active]);}}
    else if(e.key==="Escape"){hide();}});
  pop.addEventListener("mousedown",e=>{const o=e.target.closest(".opt[data-i]");if(!o)return;e.preventDefault();pick((pop._list||[])[+o.dataset.i]);});
  function pick(o){if(!o)return;onPick(o);hide();}
  document.addEventListener("mousedown",e=>{if(!input.parentElement.contains(e.target))hide();});
  return {hide,setItems(n){items=n;}};
}

/* ---------- sign-in gate ---------- */
async function doAuth(email){const url=cloudUrl();if(!url)throw new Error("not configured");
  const sep=url.indexOf("?")>=0?"&":"?";const res=await fetch(url+sep+"action=auth&email="+encodeURIComponent(email)+"&t="+Date.now());return res.json();}
function showApp(){
  $("#gate").hidden=true;
  if(AUTH&&(AUTH.name||AUTH.email)){const w=$("#whoami");if(w){w.hidden=false;w.textContent=AUTH.name||AUTH.email;}}
  loadCourses().then(()=>loadData());
}
(function initGate(){
  const form=$("#gateForm");if(!form)return;
  let last="";try{last=localStorage.getItem("hct_email")||"";}catch(e){}
  if(last)$("#gateEmail").value=last;
  form.addEventListener("submit",async ev=>{
    ev.preventDefault();
    const email=$("#gateEmail").value.trim();const err=$("#gateErr");err.hidden=true;
    if(!email){err.textContent="Please enter your email.";err.hidden=false;return;}
    const btn=$("#gateBtn");btn.disabled=true;btn.textContent="Checking…";
    try{const j=await doAuth(email);
      if(j&&j.authorized){AUTH={email:email,id:j.instructorId||"",name:j.name||""};try{localStorage.setItem("hct_email",email);}catch(e){}showApp();}
      else if(j&&j.ok===false){err.textContent="Could not verify right now. Please try again in a moment.";err.hidden=false;}
      else{err.textContent="Your email is not registered. Please contact your course team leader.";err.hidden=false;}
    }catch(e){err.textContent="Could not verify right now. Check your connection and try again.";err.hidden=false;}
    btn.disabled=false;btn.textContent="Continue";
  });
})();

/* ---------- load courses (sections) + existing data ---------- */
async function loadCourses(){
  const url=cloudUrl();const note=$("#railNote");
  try{const sep=url.indexOf("?")>=0?"&":"?";
    const res=await fetch(url+sep+"action=courses&email="+encodeURIComponent(authEmail())+"&t="+Date.now());
    const j=await res.json();
    if(j&&j.authorized&&Array.isArray(j.courses)){COURSES=j.courses;}
    else COURSES=[];
  }catch(e){COURSES=[];if(note){note.hidden=false;note.textContent="Could not load your sections — check your connection and refresh.";}}
  renderCards();
  if(COURSES.length===0&&note){note.hidden=false;note.textContent="No sections are currently assigned to your ID. Please contact your course team leader.";}
  else if(note){note.hidden=true;}
}
async function loadData(){
  const url=cloudUrl();if(!url)return;
  try{const sep=url.indexOf("?")>=0?"&":"?";
    const res=await fetch(url+sep+"t="+Date.now()+"&email="+encodeURIComponent(authEmail()),{method:"GET"});
    const j=await res.json();const vals=(j&&j.values)||[];
    if(vals.length>=2){const H=vals[0],idx=n=>H.indexOf(n);
      for(let i=1;i<vals.length;i++){const row=vals[i];
        const crn=String(row[idx("CRN")]||"").trim();const assess=String(row[idx("Assessment")]||"").trim();
        if(!crn||!assess)continue;
        const rec=blankRec();
        const enr=parseFloat(gcell(row,idx("Num Students")))||0;
        const cnt=s=>{const n=parseFloat(String(s).replace("%",""));return (isNaN(n)||!enr)?"":String(Math.round(n/100*enr));};
        rec.a=cnt(gcell(row,idx("% A band")));rec.b=cnt(gcell(row,idx("% B band")));rec.f=cnt(gcell(row,idx("% F band")));
        rec.moderation=gcell(row,idx("Post-moderation"));
        rec.status=gcell(row,idx("Status"));rec.timestamp=gcell(row,idx("Timestamp"));
        store[recKey(crn,assess)]=rec;}
    }
    renderCards();if(selIdx>=0&&shown[selIdx])openEntry(shown[selIdx]);
  }catch(e){/* data is optional for the first view */}
}
function gcell(row,i){return i>=0&&row[i]!=null?String(row[i]):"";}

/* ---------- section cards ---------- */
function renderCards(){
  const q=$("#secFilter").value.trim().toLowerCase();
  let rows=COURSES.slice();
  if(q)rows=rows.filter(r=>((r.code||"")+" "+(r.name||"")+" "+(r.crn||"")+" "+(r.campus||"")).toLowerCase().includes(q));
  rows.sort((a,b)=>String(a.code).localeCompare(String(b.code))||String(a.crn).localeCompare(String(b.crn)));
  shown=rows;
  $("#secCount").textContent=rows.length+(COURSES.length&&rows.length!==COURSES.length?" of "+COURSES.length:"")+" section"+(rows.length===1?"":"s");
  const box=$("#cards");
  if(!rows.length){box.innerHTML='<div class="opt-empty">No sections match</div>';return;}
  box.innerHTML=rows.map((r,i)=>{
    const done=sectionHasData(r.crn);
    return `<button type="button" class="scard${i===selIdx?' sel':''}" data-i="${i}">
      <div class="r1"><span class="cc">${hl(r.code||"—",q)}</span><span class="crn">CRN ${hl(String(r.crn),q)}</span>
        ${done?'<span class="done"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>entered</span>':''}</div>
      <div class="ti">${hl(r.name||"—",q)}</div>
      <div class="r2"><span>${r.campus?esc(r.campus)+" · ":""}${r.students!=null&&r.students!==""?esc(r.students)+" students":"—"}</span>${r.program?'<span>· '+esc(r.program)+'</span>':''}</div>
    </button>`;
  }).join("");
}
$("#secFilter").addEventListener("input",renderCards);
$("#cards").addEventListener("click",e=>{const b=e.target.closest(".scard[data-i]");if(!b)return;selIdx=+b.dataset.i;renderCards();openEntry(shown[selIdx]);});

/* ---------- assessment entry ---------- */
function assessOptions(row){
  const list=(Array.isArray(row.assessments)&&row.assessments.length)?row.assessments:ASSESS_FALLBACK;
  return list.map(a=>({value:String(a),_search:String(a).toLowerCase()}));
}
let curRow=null, curAssess="", curRec=null;

function openEntry(row){
  curRow=row;curAssess="";curRec=null;
  $("#emptyState").hidden=true;const f=$("#form");f.hidden=false;
  const enr=enrolledOf(row);
  f.innerHTML=`
    <div class="formhead">
      <div class="crumb"><span class="code">${esc(row.code||"")}</span> &rsaquo; ${esc(row.name||"")}</div>
      <h2>CRN <span class="mono">${esc(row.crn)}</span></h2>
      <div class="meta">
        <span>Campus <b>${esc(row.campus||"—")}</b></span>
        <span>Enrolled <b class="mono">${enr||"—"}</b></span>
        ${row.program?'<span>Program <b>'+esc(row.program)+'</b></span>':''}
        <span>Instructor <b>${esc(row.instructor||AUTH.name||"—")}</b></span>
      </div>
    </div>
    <div class="panel">
      <div class="panel-row">
        <div class="field combo" id="assessCombo">
          <label class="lbl" for="assessInput">Assessment</label>
          <input class="inp" id="assessInput" type="text" placeholder="Choose or type an assessment&hellip;" autocomplete="off">
          <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          <div class="pop" id="assessPop" hidden></div>
        </div>
        <div class="field"><label class="lbl" for="e_mod">Post-moderation done</label>
          <select class="inp" id="e_mod"><option value="">Select</option>${POSTMOD.map(o=>`<option>${o}</option>`).join("")}</select></div>
      </div>
      <div id="bands"></div>
      <div id="dyn"></div>
      <div class="formfoot">
        <button type="button" class="btn primary" id="btnSave">Save &amp; notify</button>
        <button type="button" class="ghost" id="btnClear">Clear</button>
        <span class="savehint" id="recTs"></span>
      </div>
    </div>`;
  // assessment combo
  const inp=$("#assessInput"),pop=$("#assessPop");
  const combo=makeCombo(inp,pop,assessOptions(row),o=>{inp.value=o.value;selectAssessment(o.value);},(o,q)=>`${hl(o.value,q)}`);
  inp.addEventListener("input",()=>{selectAssessment(inp.value.trim());});
  $("#e_mod").addEventListener("change",e=>{if(curRec)curRec.moderation=e.target.value;});
  renderBands();
  $("#btnSave").addEventListener("click",saveEntry);
  $("#btnClear").addEventListener("click",clearEntry);
  $("#btnSave").disabled=true;
}

function selectAssessment(name){
  curAssess=name;
  if(!name){curRec=null;$("#btnSave").disabled=true;$("#recTs").textContent="";renderBands();$("#dyn").innerHTML="";return;}
  curRec=getRec(curRow.crn,name);
  // reflect saved values
  for(const b of BANDS){const el=$("#e_"+b.k);if(el)el.value=curRec[b.k]||"";}
  const mod=$("#e_mod");if(mod)mod.value=curRec.moderation||"";
  $("#recTs").textContent=curRec.timestamp?("Recorded "+formatTs(curRec.timestamp)):"";
  renderBands();updateState();
}

function renderBands(){
  const enr=enrolledOf(curRow);
  $("#bands").innerHTML=BANDS.map(b=>`
    <div class="band" data-band="${b.k}">
      <div class="bh"><span class="bt">${b.label}</span><span class="cap">Accepted ≤ ${b.cap}%</span></div>
      <div class="brow">
        <div class="field"><label class="lbl" for="e_${b.k}"># students</label>
          <input class="inp" id="e_${b.k}" type="text" inputmode="numeric" autocomplete="off" placeholder="0" ${curAssess?"":"disabled"} value="${curRec?esc(curRec[b.k]):""}"></div>
        <div class="pctbox" id="p_${b.k}"><small>of ${enr||"—"}</small>—</div>
      </div>
    </div>`).join("");
  for(const b of BANDS){const el=$("#e_"+b.k);if(!el)continue;
    el.addEventListener("input",()=>{let v=el.value.replace(/[^0-9]/g,"");if(v!==""){let n=parseInt(v,10);if(n>enr)v=String(enr);}if(v!==el.value)el.value=v;if(curRec)curRec[b.k]=el.value;updateState();});
  }
  updateState();
}

function bandPct(k){return pctOf(curRec?curRec[k]:"",enrolledOf(curRow));}
function anyRed(){return BANDS.some(b=>{const p=bandPct(b.k);return p!=null&&p>b.cap;});}
function allEntered(){return BANDS.every(b=>curRec&&curRec[b.k]!=="");}
function cntOf(k){const n=parseInt(curRec?curRec[k]:"",10);return isNaN(n)?0:n;}
function sumCounts(){return cntOf("a")+cntOf("b")+cntOf("f");}
function sumOver(){return sumCounts()>enrolledOf(curRow);}

function updateState(){
  if(!curRec){return;}
  const enr=enrolledOf(curRow);
  for(const b of BANDS){
    const box=$("#p_"+b.k);if(!box)continue;
    const p=bandPct(b.k);
    if(p==null){box.className="pctbox";box.innerHTML=`<small>of ${enr||"—"}</small>—`;}
    else{const over=p>b.cap;box.className="pctbox "+(over?"bad":"ok");box.innerHTML=`<small>of ${enr||"—"}</small>${p}%`;}
  }
  const red=anyRed(), entered=allEntered();
  const dyn=$("#dyn");
  if(entered&&sumOver()){
    dyn.innerHTML=`<div class="notice bad"><b>Check the numbers.</b> The total students across A, B and F (${sumCounts()}) exceed the enrolled total (${enr||0}). Please correct the entries.</div>`;
    $("#btnSave").disabled=false;return;
  }
  let html="";
  if(entered){
    if(red){html+=`<div class="notice bad"><b>Outside the accepted range.</b> One or more bands exceed the accepted percentage. Please provide a justification — this section will be sent to the Academic Program Chair for review.</div>`
      +`<div class="field" style="margin-top:12px"><label class="lbl" for="e_just">Justification (required)</label><textarea class="inp" id="e_just" rows="3" placeholder="Explain why the distribution is outside the accepted range&hellip;">${curRec?esc(curRec.justification):""}</textarea></div>`;}
    else{html+=`<div class="notice ok"><b>Within the accepted range</b> for all bands.</div>`;}
    html+=`<label class="confirm"><input type="checkbox" id="e_conf" ${curRec&&curRec.confirmed?"checked":""}><span>I confirm that the grade distribution entered above is accurate and correct, and has been reviewed for completeness.</span></label>`;
  }
  dyn.innerHTML=html;
  if(entered){
    const j=$("#e_just");if(j)j.addEventListener("input",e=>{curRec.justification=e.target.value;});
    const cf=$("#e_conf");if(cf)cf.addEventListener("change",e=>{curRec.confirmed=e.target.checked;});
  }
  $("#btnSave").disabled=!(curAssess&&entered);
}

async function saveEntry(){
  if(!curRec||!curAssess){toast("Choose an assessment first");return;}
  if(!allEntered()){toast("Enter the number of students in all three bands");return;}
  if(sumOver()){showPopup("Check the numbers","The total number of students across A, B and F ("+sumCounts()+") exceeds the enrolled total ("+(enrolledOf(curRow)||0)+"). Please correct the entries.");return;}
  if(!curRec.confirmed){toast("Please tick the confirmation box before saving");return;}
  const red=anyRed();
  if(red&&!(curRec.justification&&curRec.justification.trim())){toast("Please add a justification for the out-of-range grades");return;}
  const btn=$("#btnSave");btn.disabled=true;btn.textContent="Saving…";
  const payload=buildSubmit();
  try{
    const ok=await cloudSubmit(payload);
    if(ok){curRec.timestamp=new Date().toISOString();$("#recTs").textContent="Recorded "+formatTs(curRec.timestamp);renderCards();
      if(red)toast("Saved — sent to the Academic Program Chair for review");
      else showPopup("Thank you!","The submitted grades are within the accepted ranges. Please proceed and post the grades to your students. A confirmation email has been sent to you.");}
    else toast("Saved, but the email/record could not be confirmed. Please retry.");
  }catch(e){toast("Could not save right now. Please try again.");}
  btn.textContent="Save & notify";btn.disabled=!(curAssess&&allEntered());
}
function buildSubmit(){
  const r=curRow,rec=curRec,enr=enrolledOf(r);
  const red=anyRed();
  const status=red?"Sent to APC for Approval":"To be posted";
  rec.status=status;
  const H=["Campus","Course Code","Course Name","CRN","Assessment","Num Students",
    "% A band","% B band","% F band","Faculty Name","Faculty Email","Post-moderation","Program","APC Email","Timestamp","Status"];
  const row=[r.campus||"",r.code||"",r.name||"",String(r.crn),curAssess,enr,
    fmtp(bandPct("a")),fmtp(bandPct("b")),fmtp(bandPct("f")),(AUTH.name||""),authEmail(),(rec.moderation||""),r.program||"","","",status];
  return {action:"submit",token:SHEET_TOKEN,email:authEmail(),crn:String(r.crn),assessment:curAssess,
    red:red,status:status,program:r.program||"",justification:rec.justification||"",
    courseCode:r.code||"",courseName:r.name||"",headers:H,row:row};
}
function fmtp(p){return p==null?"":String(p)+"%";}
async function cloudSubmit(payload){
  const url=cloudUrl();if(!url)return false;
  try{const res=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    try{const j=await res.json();return !!(j&&j.ok);}catch(e){return res.ok;}}
  catch(e){try{await fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});return true;}catch(e2){return false;}}
}
function clearEntry(){
  if(!curAssess){return;}
  // Clear only resets the form. Saved submissions remain in the Data file as a permanent audit trail.
  store[recKey(curRow.crn,curAssess)]=blankRec();curRec=getRec(curRow.crn,curAssess);
  for(const b of BANDS){const el=$("#e_"+b.k);if(el)el.value="";}
  const mod=$("#e_mod");if(mod)mod.value="";
  $("#recTs").textContent="";
  renderBands();toast("Cleared — enter new values");
}

/* ---------- theme ---------- */
(function(){const root=document.documentElement;let saved;try{saved=localStorage.getItem("hct_theme");}catch(e){}
  if(saved)root.setAttribute("data-theme",saved);
  $("#btnTheme").addEventListener("click",()=>{const dark=matchMedia("(prefers-color-scheme:dark)").matches;
    const cur=root.getAttribute("data-theme")||(dark?"dark":"light");const next=cur==="dark"?"light":"dark";
    root.setAttribute("data-theme",next);try{localStorage.setItem("hct_theme",next);}catch(e){}});})();

$("#popOk").addEventListener("click",()=>{$("#popScrim").hidden=true;});
$("#popScrim").addEventListener("mousedown",e=>{if(e.target===$("#popScrim"))$("#popScrim").hidden=true;});
$("#btnClose").addEventListener("click",()=>{try{window.open('','_self');}catch(e){}try{window.close();}catch(e){}setTimeout(()=>toast("Your work is saved. You can now close this browser tab."),250);});
window.addEventListener("DOMContentLoaded",()=>{const g=$("#gateEmail");if(g)g.focus();});
</script>
